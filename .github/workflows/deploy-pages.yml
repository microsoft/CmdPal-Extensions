name: Deploy extension gallery to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - pages/**
      - extensions.json
      - extensions/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          path: ./pages
        env:
          ASTRO_SITE: "${{ vars.CMDPAL_GALLERY_SITE || format('https://{0}.github.io', github.repository_owner) }}"
          ASTRO_BASE: "${{ vars.CMDPAL_GALLERY_BASE || format('/{0}', github.event.repository.name) }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
